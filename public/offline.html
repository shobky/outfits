<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0e1014" />
    <title>Outfits · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0e1014; color: #f1f2f4; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; padding: 28px; border-radius: 28px; background: #171a20; text-align: center; }
      p { color: #a8adb8; line-height: 1.5; }
      button { border: 0; border-radius: 999px; padding: 12px 18px; background: #c8f05a; color: #151515; font-weight: 650; font-size: 14px; }
    </style>
  </head>
  <body><main><h1>You're offline</h1><p>Outfits will reconnect when your connection returns. Your saved wardrobe stays on your account.</p><button onclick="location.reload()">Try again</button></main></body>
